<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Tic Tac Toe</h1>

    <form id="setup-form">
      <label>Player X
        <input type="text" id="player-x" placeholder="Player X" maxlength="20">
      </label>
      <label>Player O
        <input type="text" id="player-o" placeholder="Player O" maxlength="20">
      </label>
      <button type="submit" id="start-btn">Start Game</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <div id="board" aria-label="Game board"></div>
  </main>
</body>
</html>
